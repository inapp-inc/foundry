        <style>
            :root {
                --bg: #f7f8fb;
                --bg-panel: #ffffff;
                --bg-panel-2: #eef0f6;
                --border: #dde1ea;
                --text: #1c2030;
                --text-dim: #666e85;
                --accent: #3b5bdb;
                --accent-2: #0d9d76;
                --radius: 10px;
            }

            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid var(--border);
            }

            .staticrypt-page {
                width: 380px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .brand-row {
                display: flex;
                align-items: center;
                gap: 12px;
                justify-content: center;
                margin-bottom: 22px;
            }
            .brand-logo { height: 26px; width: auto; display: block; }
            .brand-pill {
                font-size: 0.66rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--accent);
                background: rgba(59, 91, 219, 0.1);
                border: 1px solid rgba(59, 91, 219, 0.25);
                border-radius: 999px;
                padding: 4px 10px;
                white-space: nowrap;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--bg-panel);
                max-width: 380px;
                margin: 0 auto 20px;
                padding: 40px 36px;
                text-align: center;
                box-sizing: border-box;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: 0 8px 28px rgba(28, 32, 48, 0.08);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                color: var(--text);
                outline: 0;
                padding: 14px 30px 14px 14px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg-panel-2);
                width: 100%;
                border: 1px solid var(--border);
                border-radius: 8px;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.04em;
                outline: 0;
                background: #3b5bdb;
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 14px;
                color: #ffffff;
                font-size: 13px;
                font-weight: 600;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                cursor: pointer;
                transition: filter 0.12s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #3b5bdb;
                filter: brightness(90%);
            }

            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f7f8fb;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--text);
            }

            .staticrypt-instructions {
                margin-top: -0.4em;
                margin-bottom: 1em;
                color: var(--text-dim);
                font-size: 0.88rem;
                line-height: 1.5;
            }

            .staticrypt-title {
                font-size: 1.15rem;
                font-weight: 700;
                color: var(--text);
                margin: 0 0 6px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                color: var(--text-dim);
                font-size: 0.85rem;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 0.8em;
                accent-color: var(--accent);
            }

            .hidden { display: none !important; }

            .staticrypt-footer {
                text-align: center;
                padding-bottom: 30px;
                font-size: 0.72rem;
                color: var(--text-dim);
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--border);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
